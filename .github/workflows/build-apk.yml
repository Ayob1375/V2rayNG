name: Build Custom APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v2.3.13-custom1). Leave empty to only build artifacts.'
        required: false
        type: string
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code (no submodules needed)
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        # Inject the NDK version into the app gradle file (anchored after compileSdk)
        sed -i 's/^    compileSdk = 37$/    compileSdk = 37\n    ndkVersion = "30.0.16248370"/' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts
        grep -n "ndkVersion" ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Clone hev-socks5-tunnel sources
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun cache
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Download libv2ray.aar (pinned to the submodule version)
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: 'v26.10.21'
        fileName: 'libv2ray.aar'
        out-file-path: 'V2rayNG/app/libs'

    - name: Verify libs
      run: |
        ls -la V2rayNG/app/libs/
        test -f V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare signing (secrets take priority, fallback to committed signing.properties)
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        KS_PASS_SEC: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KS_ALIAS_SEC: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASS_SEC: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        set -e
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sign.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/sign.keystore"
            echo "storePassword=$KS_PASS_SEC"
            echo "keyAlias=$KS_ALIAS_SEC"
            echo "keyPassword=$KEY_PASS_SEC"
          } > V2rayNG/app/signing.properties
          echo "Signing with: GitHub secrets keystore"
        else
          echo "Signing with: committed signing.properties (repo signing key)"
        fi

    - name: Build Release APK (signed via signing.properties)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleRelease --stacktrace

    - name: List APK outputs
      run: |
        find V2rayNG/app/build/outputs/apk -name '*.apk' -exec ls -la {} \;

    - name: Verify APK signing (fail if unsigned)
      run: |
        python3 - <<'PY'
        import glob, sys
        apks = glob.glob('V2rayNG/app/build/outputs/apk/*/release/*.apk')
        print(f'Found {len(apks)} release APKs')
        any_signed = False
        for apk in apks:
            signed = b'APK Sig Block 42' in open(apk, 'rb').read()
            print(('SIGNED  ' if signed else 'UNSIGNED') + ' - ' + apk)
            any_signed = any_signed or signed
        sys.exit(0 if (apks and any_signed) else 1)
        PY

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APKs
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: x86-apks
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86_64*.apk
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Collect APK files
        run: |
          mkdir -p release-files
          find release -type f -name '*.apk' -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Upload APKs to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-files/*
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          file_glob: true
          overwrite: true
          prerelease: false
          make_latest: true
